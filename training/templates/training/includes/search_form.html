<form method="get" class="row g-2 mb-3">
  <div class="col-sm-9 col-md-10">
    <input
      type="search"
      name="q"
      value="{{ search_query }}"
      class="form-control"
      placeholder="{{ placeholder|default:'Search' }}"
    >
  </div>
  <div class="col-sm-3 col-md-2">
    <button type="submit" class="btn btn-primary w-100">Search</button>
  </div>
</form>
