<form method="get" class="content-card card-body mb-3">
  <div class="row g-2 align-items-center">
    <div class="col-sm">
    <input
      type="search"
      name="q"
      value="{{ search_query }}"
      class="form-control"
      placeholder="{{ placeholder|default:'Search' }}"
    >
    </div>
    <div class="col-sm-auto">
      <button type="submit" class="btn btn-primary w-100">Search</button>
    </div>
    {% if search_query %}
      <div class="col-sm-auto">
        <a href="{{ request.path }}" class="btn btn-outline-secondary w-100">Clear</a>
      </div>
    {% endif %}
  </div>
</form>
