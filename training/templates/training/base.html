<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gym Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="{% url 'training:home' %}">Gym Tracker</a>
        <div class="navbar-nav me-auto">
          <a class="nav-link" href="{% url 'training:athlete-list' %}">Athletes</a>
          <a class="nav-link" href="{% url 'training:muscle-group-list' %}">Muscle groups</a>
          <a class="nav-link" href="{% url 'training:exercise-list' %}">Exercises</a>
          <a class="nav-link" href="{% url 'training:workout-plan-list' %}">Workout plans</a>
        </div>
        <div class="navbar-nav ms-auto align-items-lg-center">
          {% if request.user.is_authenticated %}
            <span class="navbar-text me-lg-3">{{ request.user }}</span>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
            </form>
          {% else %}
            <a class="nav-link" href="{% url 'login' %}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
